apiVersion: 1

datasources:
  - name: system-network
    type: elasticsearch
    uid: SYSTEM_NETWORK
    access: proxy
    url: http://routebox-elasticsearch:12102
    user: elastic
    isDefault: true
    basicAuth: true
    basicAuthUser: "elastic"
    jsonData:
      includeFrozen: false
      index: "system_network_log"
      maxConcurrentShardRequests: 5
      oauthPassThru: false
      sigV4Auth: false
      timeField: "timestamp"
    secureJsonData:
      basicAuthPassword: "routebox"
    editable: true

